
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CloudCase AI | Case Study Report</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Libre+Baskerville:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/report.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="report-navbar no-print">
        <div class="report-nav-inner">

            <a href="dashboard.html" class="report-brand">
                <span class="brand-icon">
                    <i class="bi bi-cloud-check-fill"></i>
                </span>

                <span>
                    <strong>CloudCase</strong>
                    <small>AI</small>
                </span>
            </a>

            <div class="report-nav-actions">
                <a href="dashboard.html" class="nav-action">
                    <i class="bi bi-grid"></i>
                    Dashboard
                </a>

                <a href="history.html" class="nav-action">
                    <i class="bi bi-clock-history"></i>
                    History
                </a>
            </div>

        </div>
    </nav>


    <!-- TOOLBAR -->
    <div class="report-toolbar no-print">
        <div class="toolbar-inner">

            <div>
                <strong>Case Study Report</strong>
                <span id="toolbarTopic">Loading...</span>
            </div>

            <div class="toolbar-actions">

                <button
                    type="button"
                    class="toolbar-btn"
                    id="backBtn"
                >
                    <i class="bi bi-arrow-left"></i>
                    Back
                </button>

                <button
                    type="button"
                    class="toolbar-btn"
                    id="printBtn"
                >
                    <i class="bi bi-printer"></i>
                    Print
                </button>

                <button
                    type="button"
                    class="toolbar-btn primary"
                    id="pdfBtn"
                >
                    <i class="bi bi-file-earmark-pdf"></i>
                    Save as PDF
                </button>

            </div>

        </div>
    </div>


    <!-- MAIN -->
    <main class="report-main">

        <!-- LOADING -->
        <section id="loadingState" class="report-loading">

            <div class="loading-spinner">
                <div class="spinner-border"></div>
            </div>

            <h2>Preparing your case study...</h2>

            <p>
                CloudCase AI is loading your professional academic report.
            </p>

        </section>


        <!-- ERROR -->
        <section id="errorState" class="report-error" hidden>

            <div class="error-icon">
                <i class="bi bi-exclamation-triangle"></i>
            </div>

            <h2>Unable to load report</h2>

            <p id="errorMessage">
                The requested case study could not be loaded.
            </p>

            <a href="dashboard.html" class="error-btn">
                <i class="bi bi-arrow-left"></i>
                Return to Dashboard
            </a>

        </section>


        <!-- REPORT -->
        <article
            id="reportContainer"
            class="report-document"
            hidden
        >
        </article>

    </main>


    <!-- TOAST -->
    <div
        id="reportToast"
        class="report-toast no-print"
    ></div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script
        type="module"
        src="js/report.js"
    ></script>

</body>
</html>
